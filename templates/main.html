<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
</head>
<body>
    <div class="container" style="max-width:480px;">
        <h2>AN6802 Financial WebApp</h2>
        {% if username %}<p style="color:#4f8ef7;margin-top:4px;">Welcome, {{ username }}</p>{% endif %}


        <form action="/ethics" method="post">
            <input type="submit" value="Ethical Test">
        </form>
        <form action="/econ" method="post">
            <input type="submit" value="Food Expenditure Prediction">
        </form>
        <form action="/chatbot" method="post">
            <input type="submit" value="Financial Analysis Chatbot">
        </form>
        <form action="/equity" method="post">
            <input type="submit" value="Google Share Enquiry">
        </form>
        <form action="/apple" method="post">
            <input type="submit" value="Apple Inc Enquiry">
        </form>
        <form action="/stock" method="post">
            <input type="submit" value="Stock Price & Risk Analysis (DBS / UOB)">
        </form>
        <form action="/risk" method="post">
            <input type="submit" value="Risk Calculator (VaR, Sharpe, Drawdown)">
        </form>
        <form action="/governance" method="post">
            <input type="submit" value="AI Governance & Ethics">
        </form>
        <form action="/" method="post">
            <input type="submit" value="Exit" style="background:rgba(255,255,255,0.06);color:#7d8590;">
        </form>
    </div>
</body>
